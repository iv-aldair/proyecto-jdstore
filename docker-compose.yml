version: '3.8'

services:
  # ── 1. Gestor de Contenidos Drupal 10 Headless CMS (JSON:API en puerto 8080) ──
  drupal-cms:
    image: drupal:10-apache
    container_name: jdstore_drupal_cms
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - drupal-db
    environment:
      DRUPAL_DB_HOST: drupal-db
      DRUPAL_DB_PORT: "3306"
      DRUPAL_DB_NAME: tienda_jdstore_drupal
      DRUPAL_DB_USER: drupal_user
      DRUPAL_DB_PASSWORD: drupal_password_2026
    volumes:
      - drupal_modules:/var/www/html/modules
      - drupal_profiles:/var/www/html/profiles
      - drupal_themes:/var/www/html/themes
      - drupal_sites:/var/www/html/sites

  # ── 2. Base de Datos dedicada para Drupal 10 CMS ──
  drupal-db:
    image: mariadb:10.11
    container_name: jdstore_drupal_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_drupal_2026
      MYSQL_DATABASE: tienda_jdstore_drupal
      MYSQL_USER: drupal_user
      MYSQL_PASSWORD: drupal_password_2026
    volumes:
      - drupal_db_data:/var/lib/mysql

  # ── 3. Plataforma de Automatización y Chatbot IA con n8n (Puerto 5678) ──
  n8n-chatbot:
    image: n8nio/n8n:latest
    container_name: jdstore_n8n_chatbot
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  drupal_modules:
  drupal_profiles:
  drupal_themes:
  drupal_sites:
  drupal_db_data:
  n8n_data:
